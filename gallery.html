<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Bee Chanan</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #FEFAF0;
            --surface: #ffffff;
            --surface-soft: #F3F1C4;
            --text: #403F2B;
            --text-muted: #5A553D;
            --accent: #A18A5F;
            --border: rgba(64, 63, 43, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Avenir', 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(243, 241, 196, 0.3), transparent 28%), radial-gradient(circle at bottom right, rgba(217, 217, 204, 0.2), transparent 30%);
            pointer-events: none;
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 0 24px;
            border-bottom: 1px solid rgba(64, 63, 43, 0.12);
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 5;
        }

        .logo {
            height: 56px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 32px;
        }

        nav a {
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        nav a:hover {
            color: var(--accent);
        }

        .gallery {
            padding: 60px 0;
        }

        .gallery h1 {
            font-size: clamp(2.8rem, 5vw, 3.6rem);
            font-weight: 500;
            margin-bottom: 36px;
            text-align: center;
            letter-spacing: -0.03em;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .gallery-item {
            background: var(--surface);
            border-radius: 22px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(64, 63, 43, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(64, 63, 43, 0.12);
        }

        .gallery-item img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        footer {
            background: var(--bg);
            padding: 40px 0 32px;
            margin-top: 60px;
            border-top: 1px solid rgba(64, 63, 43, 0.12);
        }

        .footer-content {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .footer-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .footer-row a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-row a:hover {
            text-decoration: underline;
        }

        .footer-row img {
            width: 24px;
            height: 24px;
            display: inline-block;
            vertical-align: middle;
            filter: saturate(0.7);
        }

        @media (max-width: 680px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            nav ul {
                gap: 18px;
                flex-wrap: wrap;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="images/logo-transparent.png" alt="Bee Chanan Logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="gallery.html">Gallery</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="gallery">
            <h1>Gallery</h1>
            <div class="gallery-grid" id="gallery-grid">
                <!-- Images will be loaded here by JavaScript -->
            </div>
        </section>
    </main>

    <script>
        const galleryGrid = document.getElementById('gallery-grid');
        let imageIndex = 1;

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject();
                img.src = src;
            });
        }

        async function loadGallery() {
            while (true) {
                try {
                    const img = await loadImage(`gallery/${imageIndex}.jpg`);
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.appendChild(img);
                    galleryGrid.appendChild(div);
                    imageIndex++;
                } catch {
                    break; // Stop when no more images
                }
            }
        }

        loadGallery();
    </script>
</body>
</html>
